[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockai-fusion"
version = "0.1.0"
description = "Reproducible provenance-aware blockchain and AI workflow anomaly detection research framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "networkx>=3.0", "torch>=2.1", "scikit-learn>=1.3", "pandas>=1.5", "scipy>=1.10", "PyYAML>=6.0", "cryptography>=41", "matplotlib>=3.7", "requests>=2.28"]

[project.optional-dependencies]
experiments = ["optuna>=3.5", "xgboost>=2.0", "openml>=0.14"]
tests = ["pytest>=7.4"]

[project.scripts]
blockai = "blockai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
